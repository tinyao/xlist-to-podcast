# 播客配置文件
# 每个播客对应一个 X (Twitter) List，每天自动生成一期音频节目。
#
# 字段说明：
#   id              — 唯一标识，创建后不要修改
#   name            — 播客名称
#   description     — 播客简介
#   twitter_list_url — X List 链接
#   twitter_list_id  — X List 数字 ID
#   voice           — OpenAI TTS 音色：alloy / echo / fable / onyx / nova / shimmer
#   language        — 语言：zh / en
#   publish_hour    — 发布时间（北京时间，0-23）
#   frequency       — 发布频率：daily（每天）/ weekly（每周），默认 daily（可选）
#   publish_day     — 每周发布星期（0=周一..6=周日），仅 frequency=weekly 时生效（可选）
#   extra_prompt    — 补充 LLM 提示词，追加到默认 prompt 末尾（可选）
#   cover_file      — 封面图路径（相对于仓库根目录 covers/ 目录）
#   owner_name      — iTunes 播客所有者姓名（可选）
#   owner_email     — iTunes 播客所有者邮箱（可选）
#   category        — iTunes 分类，默认 "Technology"（可选）
#   feishu_webhook  — 飞书群机器人 Webhook 地址，配置后生成新节目时自动推送通知（可选）
#   subscribe_links — 多平台订阅链接（可选），支持的 key：spotify / apple / xiaoyuzhou
#                     示例：
#                       subscribe_links:
#                         spotify: "https://open.spotify.com/show/xxx"
#                         apple: "https://podcasts.apple.com/podcast/xxx"
#                         xiaoyuzhou: "https://www.xiaoyuzhoufm.com/podcast/xxx"
#
# 示例：
#   podcasts:
#     - id: "my-podcast"
#       name: "AI 日报"
#       description: "每日 AI 科技动态"
#       twitter_list_url: "https://x.com/i/lists/123456"
#       twitter_list_id: "123456"
#       voice: "nova"
#       language: "zh"
#       publish_hour: 8
#       cover_file: "ai-daily.jpg"
#       owner_name: "Your Name"
#       owner_email: "you@example.com"
#       category: "Technology"


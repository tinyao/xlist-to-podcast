    twitter_list_url: "https://x.com/i/lists/2007466263661232466"
    twitter_list_id: "2007466263661232466"
    voice: "nova"
    language: "zh"
    publish_hour: 7
    cover_file: "ai-daily.jpg"
    owner_name: "Ryan Yao"
    owner_email: "hi@zao.im"
    category: "Technology"
    subscribe_links:
      spotify: "https://open.spotify.com/show/2XWstEer4GWhVg6GCGBOo2"
      xiaoyuzhou: "https://www.xiaoyuzhoufm.com/podcast/69a8f097f44c14356ad7f22e"

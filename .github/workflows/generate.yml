name: Generate Episodes

on:
  schedule:
    - cron: '0 * * * *'  # 每小时整点
  workflow_dispatch:
    inputs:
      force:
        description: '忽略 publish_hour，强制生成'
        type: boolean
        default: false
      podcast_id:
        description: '只处理指定播客 ID（留空处理全部）'
        type: string
        default: ''
      max_posts:
        description: '最大抓取推文数（留空使用默认值 300）'
        type: string
        default: ''
      regenerate_date:
        description: '重新生成指定日期的 episode（YYYY-MM-DD），跳过推文抓取。必须配合 podcast_id 使用。'
        type: string
        default: ''

concurrency:
  group: generate-episodes
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run generate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET_NAME: ${{ secrets.OSS_BUCKET_NAME }}
          OSS_CDN_URL: ${{ secrets.OSS_CDN_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.podcast_id }}" ]; then
            ARGS="$ARGS --podcast ${{ inputs.podcast_id }}"
          fi
          if [ -n "${{ inputs.max_posts }}" ]; then
            ARGS="$ARGS --max-posts ${{ inputs.max_posts }}"
          fi
          if [ -n "${{ inputs.regenerate_date }}" ]; then
            ARGS="$ARGS --regenerate-date ${{ inputs.regenerate_date }}"
          fi
          python -m generate $ARGS

      - name: Commit and publish changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          # Check if there are new episode files (episode.json, posts.md, script.md, shownotes.md)
          HAS_NEW_EPISODE=$(git diff --cached --name-only | grep -c 'docs/.*/episodes/.*/episode\.json' || true)
          if [ "$HAS_NEW_EPISODE" -gt 0 ]; then
            echo "New episode detected, creating PR..."
            BRANCH="episode/${DATE}-$(date -u +%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "New episode ${DATE}"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "🎙️ New episode ${DATE}" \
              --body "Auto-generated episode update for ${DATE}." \
              --base main
          else
            echo "No new episode, pushing directly to main..."
            git commit -m "Update feeds ${DATE}"
            git push
          fi
